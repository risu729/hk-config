# ref: https://mise.jdx.dev/configuration.html
#:schema https://mise.jdx.dev/schema/mise.json

min_version = "2026.10.9"

[tools]
hk = "2.9.0"
pkl = "0.32.2"
jactionlint = "v2.3.0"
ghalint = "1.5.7"
pinact = "5.0.2"
zizmor = "1.31.1"
shellcheck = "0.11.0"
lychee = "0.24.2"
"npm:semantic-release" = "25.0.9"

[settings]
lockfile = true
lockfile_mode = "generate"

[task_config]
includes = ["tasks.toml"]

[hooks]
postinstall = """
{% if env.CI is undefined %}
  hk install --mise
{% endif %}
"""
