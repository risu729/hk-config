# ref: https://mise.jdx.dev/configuration.html
#:schema https://mise.jdx.dev/schema/mise.json

[tools]
hk = "1.56.1"
pkl = "0.32.1"
actionlint = "1.7.12"
ghalint = "1.5.6"
pinact = "4.1.1"
zizmor = "1.30.0"
shellcheck = "0.11.0"
lychee = "0.24.2"
"npm:semantic-release" = "25.0.9"

[task_config]
includes = ["tasks.toml"]

[hooks]
postinstall = """
{% if env.CI is undefined %}
  hk install --mise
{% endif %}
"""
